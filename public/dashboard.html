<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — ParkWise</title>
    <meta name="description" content="ParkWise Operator Analytics Dashboard" />
    <link rel="stylesheet" crossorigin href="./assets/index-C0Lg0f0d.css" />
    <script>
      if (
        !window.location.hash ||
        window.location.hash === "#/" ||
        window.location.hash === ""
      ) {
        window.location.hash = "#/dashboard";
      }
    </script>
  </head>

  <body class="bg-[#f5f5f7] text-[#1d1d1f] font-sans antialiased">
    <div id="root">
      <div class="flex h-screen w-full bg-[#f5f5f7] overflow-hidden">
        <aside
          class="w-60 bg-[#1d1d1f] text-white flex flex-col hidden md:flex shrink-0"
        >
          <div class="h-14 flex items-center px-6 border-b border-white/10">
            <span class="font-bold text-lg text-white">ParkWise</span>
          </div>
          <div
            class="px-4 py-2.5 border-b border-white/10 text-xs text-white/40"
          >
            Operator Platform
          </div>
          <nav class="flex-1 py-3 px-5 text-sm text-white/70">
            <div class="py-2 font-semibold text-white">Dashboard</div>
          </nav>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
          <header
            class="h-14 bg-white border-b border-black/5 flex items-center justify-between px-6 shrink-0"
          >
            <h1 class="text-xl font-bold text-[#1d1d1f]">Dashboard</h1>
            <div class="text-xs text-[#6e6e73]">Live reports</div>
          </header>

          <main class="flex-1 p-6">
            <div class="max-w-5xl mx-auto">
              <div
                class="bg-white rounded-2xl border border-black/5 shadow-sm p-5"
              >
                <div class="flex items-center justify-between mb-4">
                  <h2 class="text-2xl font-bold text-[#1d1d1f]">
                    Parking Lot Reports
                  </h2>

                  <button
                    id="refresh-reports"
                    class="px-3 py-2 rounded-lg bg-[#1d1d1f] text-white text-sm font-medium"
                  >
                    Refresh
                  </button>
                </div>

                <div id="reports-list" class="space-y-3"></div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script>
      const reportsList = document.getElementById("reports-list");
      const refreshBtn = document.getElementById("refresh-reports");

      async function loadReports() {
        try {
          const res = await fetch("/api/reports");
          if (!res.ok) throw new Error("HTTP " + res.status);

          const reports = await res.json();

          if (!reports || reports.length === 0) {
            reportsList.innerHTML =
              '<div class="rounded-xl border border-dashed border-[#d1d5db] p-4 text-sm text-[#6e6e73]">No parking lot reports yet.</div>';
            return;
          }

          reportsList.innerHTML = reports
            .map((report) => {
              const severityClass =
                report.severity === "critical"
                  ? "bg-red-100 text-red-700"
                  : report.severity === "warning"
                    ? "bg-amber-100 text-amber-700"
                    : "bg-emerald-100 text-emerald-700";

              return `
                <div class="rounded-xl border border-black/5 bg-[#fafafa] p-4">
                  <div class="flex items-center justify-between gap-3">
                    <div class="font-bold uppercase tracking-wide text-[#1d1d1f] text-sm">
                      ${report.type}
                    </div>
                    <span class="px-2 py-1 rounded-full text-[10px] font-bold ${severityClass}">
                      ${report.severity}
                    </span>
                  </div>
                  <div class="mt-2 text-sm text-[#6e6e73]">
                    ${report.message}
                  </div>
                  <div class="mt-2 text-[11px] text-[#8e8e93]">
                    ${new Date(report.created_at).toLocaleString()}
                  </div>
                </div>
              `;
            })
            .join("");
        } catch (err) {
          console.error("Error loading reports:", err);
          reportsList.innerHTML =
            '<div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">Failed to load reports.</div>';
        }
      }

      if (refreshBtn) {
        refreshBtn.addEventListener("click", loadReports);
      }

      loadReports();
    </script>

    <script type="module" crossorigin src="./assets/index-tbUKYf1H.js"></script>
  </body>
</html>
