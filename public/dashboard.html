<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — ParkWise</title>
    <meta name="description" content="ParkWise Operator Analytics Dashboard" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" crossorigin href="./assets/index-C0Lg0f0d.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (
        !window.location.hash ||
        window.location.hash === "#/" ||
        window.location.hash === ""
      ) {
        window.location.hash = "#/dashboard";
      }
    </script>
  </head>

  <body class="bg-[#f5f5f7] text-[#1d1d1f] font-sans antialiased">
    <div id="root">
      <div class="flex h-screen w-full bg-[#f5f5f7] overflow-hidden">
        <aside
          class="w-60 bg-[#1d1d1f] text-white flex flex-col hidden md:flex shrink-0"
        >
          <div class="h-14 flex items-center px-6 border-b border-white/10">
            <span class="font-bold text-lg text-white">ParkWise</span>
          </div>
          <div
            class="px-4 py-2.5 border-b border-white/10 text-xs text-white/40"
          >
            Operator Platform
          </div>
          <nav class="flex-1 py-3 px-5 text-sm text-white/70">
            <div class="py-2 font-semibold text-white">Dashboard</div>
          </nav>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
          <header
            class="h-14 bg-white border-b border-black/5 flex items-center justify-between px-6 shrink-0"
          >
            <h1 class="text-xl font-bold text-[#1d1d1f]">Dashboard</h1>
            <div class="text-xs text-[#6e6e73]">Live reports</div>
          </header>

          <main class="flex-1 p-6">
            <div class="max-w-5xl mx-auto">
              <div
                class="bg-white rounded-2xl border border-black/5 shadow-sm p-5"
              >
                <div class="flex items-center justify-between mb-4">
                  <h2 class="text-2xl font-bold text-[#1d1d1f]">
                    Parking Lot Reports
                  </h2>
                  <button
                    id="refresh-reports"
                    class="px-3 py-2 rounded-lg bg-[#1d1d1f] text-white text-sm font-medium"
                  >
                    Refresh
                  </button>
                </div>
                <div id="reports-list" class="space-y-3"></div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script
      type="module"
      crossorigin
      src="./assets/index-tbUKYf1H.js?v=demand-forecasts-v5"
    ></script>

    <div id="custom-admin-tools" class="relative z-[9999]">
      <button
        id="open-report-modal"
        class="fixed bottom-8 right-8 bg-[#34c759] hover:bg-[#30d158] text-white px-6 py-3 rounded-full font-bold shadow-lg transition-transform hover:scale-105"
      >
        + Add Report
      </button>

      <button
        id="open-forecast-modal"
        class="fixed bottom-8 right-52 bg-[#1d1d1f] hover:bg-gray-800 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-transform hover:scale-105"
      >
        + Add Event
      </button>

      <div
        id="report-modal"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden opacity-0 transition-opacity duration-200"
      >
        <div
          class="bg-white rounded-[22px] p-8 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-200"
          id="report-modal-content"
        >
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-[#1d1d1f]">Add Parking Report</h3>
            <button
              id="close-modal-btn"
              class="text-gray-400 hover:text-gray-800 text-2xl leading-none"
            >
              &times;
            </button>
          </div>

          <form id="create-report-form" class="flex flex-col gap-4">
            <div>
              <label
                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
                >Report Type</label
              >
              <select
                id="type"
                required
                class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
              >
                <option value="Maintenance">Maintenance</option>
                <option value="Equipment Issue">Equipment Issue</option>
                <option value="Safety">Safety</option>
                <option value="Parking Issue">Parking Issue</option>
                <option value="Customer Concern">Customer Concern</option>
                <option value="Capacity">Capacity</option>
                <option value="Payment">Payment</option>
                <option value="Security">Security</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="flex gap-4">
              <div class="flex-1">
                <label
                  class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
                  >Severity</label
                >
                <select
                  id="severity"
                  required
                  class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
                >
                  <option value="info">Info</option>
                  <option value="warning">Warning</option>
                  <option value="critical">Critical</option>
                </select>
              </div>
              <div class="flex-1">
                <label
                  class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
                  >Floor</label
                >
                <select
                  id="floor"
                  class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
                >
                  <option value="">Any</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </div>
            </div>

            <div>
              <label
                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
                >Message</label
              >
              <textarea
                id="message"
                required
                maxlength="1000"
                rows="3"
                placeholder="Describe the issue..."
                class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm resize-none"
              ></textarea>
            </div>

            <button
              type="submit"
              class="w-full mt-2 py-3.5 rounded-full bg-[#1d1d1f] text-white font-semibold text-[15px] hover:bg-gray-800 transition-all"
            >
              Submit Report
            </button>
          </form>
        </div>
      </div>
    </div>

    <div
      id="forecast-modal"
      class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden opacity-0 transition-opacity duration-200"
    >
      <div
        class="bg-white rounded-[22px] p-8 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-200"
        id="forecast-modal-content"
      >
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-bold text-[#1d1d1f]">Add Forecast Event</h3>
          <button
            id="close-forecast-modal-btn"
            type="button"
            class="text-gray-400 hover:text-gray-800 text-2xl leading-none"
          >
            &times;
          </button>
        </div>
        <form id="create-forecast-form" class="flex flex-col gap-4">
          <div>
            <label
              for="event-nature"
              class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
              >Nature of event</label
            >
            <input
              id="event-nature"
              required
              maxlength="200"
              placeholder="e.g. Shopping"
              class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
            />
          </div>
          <div class="flex gap-4">
            <div class="flex-1">
              <label
                for="event-date"
                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
                >Date</label
              >
              <input
                id="event-date"
                type="date"
                required
                class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
              />
            </div>
            <div class="flex-1">
              <label
                for="event-time"
                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
                >Time</label
              >
              <input
                id="event-time"
                type="time"
                required
                class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
              />
            </div>
          </div>
          <div>
            <label
              for="event-category"
              class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
              >Category</label
            >
            <select
              id="event-category"
              required
              class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
            >
              <option value="Concert">Concert</option>
              <option value="Sports">Sports</option>
              <option value="Holiday">Holiday</option>
              <option value="Market">Market</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label
              for="event-location"
              class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1"
              >Location in Metro Manila</label
            >
            <input
              id="event-location"
              required
              maxlength="120"
              placeholder="e.g. Glorietta, Makati"
              class="w-full px-4 py-3 rounded-[12px] bg-[#f5f5f7] border border-black/5 outline-none text-sm"
            />
          </div>
          <div
            id="forecast-map"
            class="h-48 rounded-xl overflow-hidden border border-black/5"
          ></div>
          <p id="forecast-form-error" class="hidden text-sm text-red-600"></p>
          <button
            type="submit"
            class="w-full mt-2 py-3.5 rounded-full bg-[#1d1d1f] text-white font-semibold text-[15px] hover:bg-gray-800 transition-all"
          >
            Save Event
          </button>
        </form>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      const reportModal = document.getElementById("report-modal");
      const reportModalContent = document.getElementById(
        "report-modal-content",
      );
      const reportForm = document.getElementById("create-report-form");
      const forecastModal = document.getElementById("forecast-modal");
      const forecastModalContent = document.getElementById(
        "forecast-modal-content",
      );
      const forecastForm = document.getElementById("create-forecast-form");
      const forecastMapElement = document.getElementById("forecast-map");
      let forecastMap = null;
      let forecastMarker = null;
      let forecastLocation = null;

      function toggleModal(target, content, isOpen) {
        if (isOpen) {
          target.classList.remove("hidden");
          setTimeout(() => {
            target.classList.remove("opacity-0");
            content.classList.remove("scale-95");
          }, 10);
        } else {
          target.classList.add("opacity-0");
          content.classList.add("scale-95");
          setTimeout(() => target.classList.add("hidden"), 200);
        }
      }

      document
        .getElementById("open-report-modal")
        .addEventListener("click", () =>
          toggleModal(reportModal, reportModalContent, true),
        );
      document
        .getElementById("close-modal-btn")
        .addEventListener("click", () =>
          toggleModal(reportModal, reportModalContent, false),
        );
      reportModal.addEventListener("click", (event) => {
        if (event.target === reportModal)
          toggleModal(reportModal, reportModalContent, false);
      });

      document
        .getElementById("open-forecast-modal")
        .addEventListener("click", () => {
          toggleModal(forecastModal, forecastModalContent, true);
          initializeForecastMap();
        });
      document
        .getElementById("close-forecast-modal-btn")
        .addEventListener("click", () =>
          toggleModal(forecastModal, forecastModalContent, false),
        );
      forecastModal.addEventListener("click", (event) => {
        if (event.target === forecastModal)
          toggleModal(forecastModal, forecastModalContent, false);
      });

      function initializeForecastMap() {
        if (!forecastMapElement || !window.L || forecastMap) return;
        forecastMap = L.map(forecastMapElement).setView(
          [14.5995, 120.9842],
          11,
        );
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(forecastMap);
        forecastMap.on("click", (event) => {
          forecastLocation = {
            latitude: event.latlng.lat,
            longitude: event.latlng.lng,
          };
          if (!forecastMarker)
            forecastMarker = L.marker(event.latlng).addTo(forecastMap);
          else forecastMarker.setLatLng(event.latlng);
        });
        setTimeout(() => forecastMap.invalidateSize(), 50);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function loadReports() {
        const reportsList = document.getElementById("reports-list");
        if (!reportsList) return;

        try {
          const response = await fetch("/api/reports");
          const data = await response.json().catch(() => []);
          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}`);
          }

          const reports = Array.isArray(data)
            ? data
            : Array.isArray(data.reports)
              ? data.reports
              : [];

          reportsList.innerHTML = reports.length
            ? reports
                .map(
                  (report) => `
              <div class="rounded-xl border border-black/5 bg-[#fafafa] p-4">
                <div class="flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3">
                    <p class="font-bold text-sm uppercase tracking-wide text-[#1d1d1f]">${escapeHtml(report.type)}</p>
                    <span class="text-[11px] font-semibold uppercase ${report.severity === "critical" ? "text-red-600" : report.severity === "warning" ? "text-amber-600" : "text-emerald-600"}">${escapeHtml(report.severity)}</span>
                  </div>
                  <button type="button" data-delete-report="${escapeHtml(report.id)}" class="text-xs font-semibold text-red-600 hover:text-red-800">Delete</button>
                </div>
                <p class="mt-2 text-sm text-[#333]">${escapeHtml(report.message)}</p>
                <p class="mt-2 text-[11px] text-[#8e8e93]">${report.floor ? `Floor ${escapeHtml(report.floor)} · ` : ""}${new Date(report.created_at).toLocaleString()}</p>
              </div>`,
                )
                .join("")
            : '<p class="text-sm text-[#6e6e73]">No parking lot reports yet.</p>';
        } catch (error) {
          reportsList.innerHTML = `<p class="text-sm text-red-600">Could not load reports: ${escapeHtml(error.message)}</p>`;
          console.error("Error loading reports:", error);
        }
      }

      document
        .getElementById("refresh-reports")
        ?.addEventListener("click", loadReports);

      document
        .getElementById("reports-list")
        .addEventListener("click", async (event) => {
          const button = event.target.closest("[data-delete-report]");
          if (!button) return;
          const reportId = button.dataset.deleteReport;
          if (!confirm("Delete this report ticket? This cannot be undone."))
            return;

          try {
            const response = await fetch(`/api/reports/${reportId}`, {
              method: "DELETE",
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok)
              throw new Error(data.error || `HTTP ${response.status}`);
            await loadReports();
          } catch (error) {
            alert(error.message || "Could not delete the report.");
          }
        });

      reportForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const response = await fetch("/api/reports", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              type: document.getElementById("type").value,
              severity: document.getElementById("severity").value,
              floor: document.getElementById("floor").value || null,
              message: document.getElementById("message").value,
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            return alert(
              data.error ||
                `Failed to submit report (HTTP ${response.status}).`,
            );
          }
          window.dispatchEvent(
            new CustomEvent("parkwise:report-created", {
              detail: data.report,
            }),
          );
          await loadReports();
          toggleModal(reportModal, reportModalContent, false);
          reportForm.reset();
        } catch (error) {
          alert(
            "Could not connect to the backend. Start the server with npm start.",
          );
          console.error("Report submission failed:", error);
        }
      });

      loadReports();

      async function loadForecastEvents() {
        const list = document.getElementById("reports-list");
        try {
          const response = await fetch("/api/forecasts");
          if (!response.ok) throw new Error("HTTP " + response.status);
          const events = await response.json();
          let section = document.getElementById("forecast-events-list");
          if (!section) {
            section = document.createElement("div");
            section.id = "forecast-events-list";
            section.className = "mt-8 border-t border-black/5 pt-6 space-y-3";
            list.parentElement.appendChild(section);
          }
          section.innerHTML = events.length
            ? events
                .map(
                  (item) => `
            <div class="rounded-xl border border-black/5 bg-[#fafafa] p-4 flex items-center justify-between gap-3">
              <div><p class="font-semibold text-sm">${escapeHtml(item.nature)}</p><p class="text-xs text-[#6e6e73] mt-1">${escapeHtml(item.category)} · ${escapeHtml(item.event_date)} at ${escapeHtml(item.event_time)}</p><p class="text-xs text-[#8e8e93] mt-1">${escapeHtml(item.location)}</p></div>
              <button type="button" data-delete-forecast="${escapeHtml(item.id)}" class="text-xs font-semibold text-red-600 hover:text-red-800 shrink-0">Delete</button>
            </div>`,
                )
                .join("")
            : '<p class="text-sm text-[#6e6e73]">No forecast events yet.</p>';
        } catch (error) {
          console.error("Error loading forecast events:", error);
        }
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-delete-forecast]");
        if (!button) return;
        if (!confirm("Delete this forecast event? This cannot be undone."))
          return;
        try {
          const response = await fetch(
            `/api/demand-forecasts/${button.dataset.deleteForecast}`,
            { method: "DELETE" },
          );
          const data = await response.json().catch(() => ({}));
          if (!response.ok)
            throw new Error(data.error || `HTTP ${response.status}`);
          await loadForecastEvents();
          window.dispatchEvent(new CustomEvent("parkwise:forecast-deleted"));
        } catch (error) {
          alert(error.message || "Could not delete the forecast event.");
        }
      });

      forecastForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorMessage = document.getElementById("forecast-form-error");
        errorMessage.classList.add("hidden");
        try {
          const response = await fetch("/api/forecasts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nature: document.getElementById("event-nature").value,
              date: document.getElementById("event-date").value,
              time: document.getElementById("event-time").value,
              category: document.getElementById("event-category").value,
              location: document.getElementById("event-location").value.trim(),
              latitude: forecastLocation?.latitude ?? null,
              longitude: forecastLocation?.longitude ?? null,
            }),
          });
          const data = await response.json();
          if (!response.ok)
            throw new Error(data.error || "Failed to save event.");
          toggleModal(forecastModal, forecastModalContent, false);
          forecastForm.reset();
          forecastLocation = null;
          if (forecastMarker) {
            forecastMap.removeLayer(forecastMarker);
            forecastMarker = null;
          }
          loadForecastEvents();
          window.dispatchEvent(new CustomEvent("parkwise:forecast-created"));
        } catch (error) {
          errorMessage.textContent = error.message;
          errorMessage.classList.remove("hidden");
        }
      });

      loadForecastEvents();
    </script>
  </body>
</html>
