    <title>Admin Dashboard - ParkWise</title>
    <meta name="description" content="ParkWise Operator Analytics Dashboard" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="

    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D1S8ZcT3.css" />
    <style>
      .leaflet-pane img,
      .leaflet-tile-container img,
      .leaflet-marker-pane img,
      .leaflet-tile {
        max-width: none !important;
        max-height: none !important;
      }
    </style>
    <script>
      // Apply theme and glass effect before first paint to prevent flash
      try {
        const theme = localStorage.getItem("parkwise_theme") || "light";
        const isDark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.setAttribute("data-theme", "light");
        }
        if (localStorage.getItem("parkwise_glass") === "true") {
          document.documentElement.classList.add("glass-effect");
        } else {
          document.documentElement.classList.remove("glass-effect");
        }
        if (localStorage.getItem("parkwise_motion") === "false") {
          document.documentElement.classList.add("no-animations");
        } else {
          document.documentElement.classList.remove("no-animations");
        }
      } catch (e) {}

      // Route into #/dashboard if no sub-route is provided
      if (
        !window.location.hash ||
        window.location.hash === "#" ||
        window.location.hash === "#/" ||
        window.location.hash === ""
      ) {
        window.location.hash = "#/dashboard";
      }
    </script>
  </head>

    class="bg-[#f8fafc] dark:bg-[#09090b] text-gray-900 dark:text-gray-100 font-sans antialiased"

  </body>
