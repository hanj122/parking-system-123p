<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Dashboard</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Tailwind CSS via CDN — load first, then apply custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50:  '#eff4ff',
              100: '#dce8ff',
              400: '#6098ff',
              500: '#0066ff',
              600: '#0052cc',
            },
            ink: {
              900: '#0d1117',
              700: '#374151',
              400: '#6b7280',
              100: '#f3f4f6',
              50:  '#f7f9fc',
            },
          },
          borderRadius: {
            '2xl': '16px',
            '3xl': '24px',
          },
          boxShadow: {
            card:  '0 4px 24px 0 rgba(0,0,0,0.05)',
            modal: '0 20px 40px -8px rgba(0,0,0,0.14)',
          },
          letterSpacing: {
            tighter: '-0.03em',
            snug:    '-0.015em',
          },
        },
      },
    };
  </script>
</head>

<body class="bg-ink-50 text-ink-900 font-sans antialiased min-h-screen p-4 sm:p-6 lg:p-8">

  <!-- ═══════════════════════════════════════════════════════
       TWO-PANEL DASHBOARD
  ════════════════════════════════════════════════════════ -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8">

    <!-- ┌─────────────────────────────────────────────────┐
         │  LEFT PANEL — Parking Status + Floor Cards      │
         └─────────────────────────────────────────────────┘ -->
    <div class="flex flex-col gap-6">

      <!-- Panel header -->
      <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2">
        <div class="flex items-center gap-3">
          <!-- Icon chip -->
          <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-xl shrink-0">
            🅿️
          </div>
          <div>
            <p class="text-xs font-semibold tracking-[0.12em] uppercase text-ink-400">Dashboard</p>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tighter leading-none text-ink-900">Parking Status</h1>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto">
          <!-- Live indicator -->
          <span class="flex items-center gap-1.5 text-xs text-ink-400 font-medium mr-1">
            <span class="live-dot inline-block w-2 h-2 rounded-full bg-brand-500"></span>
            Live
          </span>
          <!-- Sim entry time — testing helper -->
          <input
            type="datetime-local"
            id="sim-entry-time"
            title="Override Entry Time (Testing)"
            class="text-xs px-3 py-1.5 rounded-full border border-ink-100 text-ink-400 bg-white focus:outline-none focus:border-brand-400 w-full sm:w-auto"
          />
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <button
              id="btn-entry"
              class="flex-1 sm:flex-initial text-center justify-center px-4 sm:px-5 py-2.5 rounded-full bg-brand-500 hover:bg-brand-600 active:scale-95 text-white text-xs sm:text-sm font-semibold tracking-snug transition-all duration-150 shadow-sm whitespace-nowrap"
            >
              New Car Entry
            </button>
            <a
              href="/admin.html"
              class="flex-1 sm:flex-initial text-center justify-center px-4 sm:px-5 py-2.5 rounded-full bg-ink-100 hover:bg-ink-200 active:scale-95 text-ink-700 text-xs sm:text-sm font-semibold tracking-snug transition-all duration-150 whitespace-nowrap"
            >
              Admin Login
            </a>
          </div>
        </div>
      </header>

      <!-- Toast / entry notification -->
      <div id="entry-toast" class="hidden items-center gap-3 bg-white border border-brand-100 rounded-2xl px-5 py-4 shadow-card text-sm text-ink-700">
        <div class="w-8 h-8 rounded-full bg-brand-50 flex items-center justify-center text-base shrink-0">🚗</div>
        <span id="entry-toast-msg"></span>
      </div>

      <!-- Floor cards — injected by app.js -->
      <div id="floors-container" class="flex flex-col gap-5"></div>
    </div>

    <!-- ┌─────────────────────────────────────────────────┐
         │  RIGHT PANEL — Active Tickets                   │
         └─────────────────────────────────────────────────┘ -->
    <div class="flex flex-col gap-6">

      <!-- Panel header -->
      <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2">
        <div>
          <p class="text-xs font-semibold tracking-[0.12em] uppercase text-ink-400">Search</p>
          <h2 class="text-xl sm:text-2xl font-bold tracking-tighter leading-none text-ink-900">Tickets</h2>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <!-- Sim exit time — testing helper -->
          <input
            type="datetime-local"
            id="sim-exit-time"
            title="Override Exit Time (Testing)"
            class="text-xs px-3 py-1.5 rounded-full border border-ink-100 text-ink-400 bg-white focus:outline-none focus:border-brand-400 w-full sm:w-auto"
          />
        </div>
      </header>

      <!-- Search Input -->
      <div class="flex flex-col sm:flex-row gap-2">
        <input
          type="text"
          id="search-ticket-input"
          placeholder="Enter Ticket ID"
          class="flex-1 rounded-full border border-ink-100 px-4 py-2 text-sm font-semibold text-ink-900 placeholder:text-ink-400 focus:outline-none focus:border-brand-400 bg-white"
        />
        <button
          id="btn-search"
          class="px-5 py-2 rounded-full bg-ink-900 hover:bg-ink-700 active:scale-95 text-white text-sm font-semibold tracking-snug transition-all duration-150"
        >
          Search
        </button>
      </div>

      <!-- Ticket cards — injected by app.js -->
      <div id="tickets-list" class="flex flex-col gap-4"></div>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       CHECKOUT MODAL (hidden by default)
  ════════════════════════════════════════════════════════ -->
  <div id="exit-modal" class="hidden fixed inset-0 bg-ink-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="modal-enter bg-white rounded-3xl shadow-modal w-full max-w-md flex flex-col gap-6 p-8">

      <!-- Modal title -->
      <div>
        <p class="text-xs font-semibold tracking-[0.12em] uppercase text-ink-400 mb-0.5">Processing</p>
        <h3 class="text-xl font-bold tracking-tighter text-ink-900">Checkout / Exit</h3>
      </div>

      <!-- Ticket info summary -->
      <div class="bg-ink-50 rounded-2xl px-5 py-4 flex flex-col gap-2 text-sm">
        <div class="flex justify-between">
          <span class="text-ink-400 font-medium">Ticket ID</span>
          <strong id="co-ticket-id" class="font-bold text-ink-900"></strong>
        </div>
        <div class="flex justify-between">
          <span class="text-ink-400 font-medium">Slot</span>
          <span class="font-semibold text-ink-900">
            <span id="co-slot-id"></span>
            <span class="text-ink-400 font-normal"> · Floor <span id="co-floor"></span></span>
          </span>
        </div>
        <div class="flex justify-between">
          <span class="text-ink-400 font-medium">Entry time</span>
          <span id="co-entry-time" class="font-semibold text-ink-700"></span>
        </div>

        <!-- Divider -->
        <div class="border-t border-ink-100 my-1"></div>

        <!-- Status pill + fee -->
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold tracking-[0.1em] uppercase text-ink-400">Status</span>
          <span id="co-status-pill" class="px-3 py-0.5 rounded-full bg-ink-100 text-ink-700 text-xs font-bold tracking-wide">—</span>
        </div>
        <div class="mt-2 text-center">
          <p class="text-xs text-ink-400 font-medium uppercase tracking-widest mb-1">Total Fee</p>
          <p id="co-fee-display" class="text-5xl font-extrabold tracking-tighter text-brand-500">₱—</p>
        </div>
      </div>

      <!-- Payment input -->
      <div id="payment-section" class="flex flex-col gap-2">
        <label for="cash-input" class="text-sm font-semibold text-ink-700">Cash Received (₱)</label>
        <p class="text-xs text-ink-400">Only 20 · 50 · 100 · 500 · 1000 bill combos. No coins or decimals.</p>
        <input
          type="number"
          id="cash-input"
          placeholder="e.g. 100"
          step="10"
          class="w-full rounded-full border border-ink-100 px-5 py-3 text-base font-semibold text-ink-900 placeholder:text-ink-400 focus:outline-none focus:border-brand-400 bg-white"
        />
        <p id="payment-error" class="hidden text-xs font-semibold text-red-500 px-1"></p>
      </div>

      <!-- Receipt (shown after payment) -->
      <div id="receipt-section" class="hidden flex-col gap-3 bg-green-50 border border-green-100 rounded-2xl px-5 py-4 text-center">
        <p class="text-sm font-bold text-green-600 tracking-wide">✓ Payment Successful</p>
        <p class="text-ink-400 text-xs font-medium mt-0.5">Change returned</p>
        <p class="text-3xl font-extrabold tracking-tighter text-ink-900">₱<span id="co-change"></span></p>
        <div id="co-breakdown" class="mt-2 text-left text-sm text-ink-700"></div>
      </div>

      <!-- Modal action buttons -->
      <div class="flex justify-end items-center gap-3 mt-1">
        <button id="btn-cancel"
          class="px-5 py-2.5 rounded-full border border-ink-100 text-ink-700 text-sm font-semibold hover:bg-ink-100 transition-colors">
          Cancel
        </button>
        <button id="btn-pay"
          class="px-6 py-2.5 rounded-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold tracking-snug transition-colors">
          Pay &amp; Exit
        </button>
        <button id="btn-close"
          class="hidden px-5 py-2.5 rounded-full border border-ink-100 text-ink-700 text-sm font-semibold hover:bg-ink-100 transition-colors">
          Close
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
