<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md w-full max-w-sm mx-auto">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 tracking-tight">Admin Login</h2>
    <form id="login-form">
      <div class="mb-4">
        <label class="block text-gray-700 text-xs sm:text-sm font-semibold mb-1.5" for="username">Username</label>
        <input class="border border-gray-200 rounded-full w-full py-2.5 px-4 text-sm text-gray-800 leading-tight focus:outline-none focus:border-blue-500" id="username" type="text" placeholder="Username" required>
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-xs sm:text-sm font-semibold mb-1.5" for="password">Password</label>
        <input class="border border-gray-200 rounded-full w-full py-2.5 px-4 text-sm text-gray-800 mb-2 leading-tight focus:outline-none focus:border-blue-500" id="password" type="password" placeholder="••••••••" required>
        <p id="error-msg" class="text-red-500 text-xs hidden">Invalid credentials. Try admin / admin.</p>
      </div>
      <div>
        <button class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-full focus:outline-none w-full text-sm transition-all duration-150" type="submit">
          Sign In
        </button>
      </div>
    </form>
    <div class="mt-5 text-center">
      <a href="/index.html" class="text-xs sm:text-sm text-blue-600 hover:underline">← Back to Main Dashboard</a>
    </div>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === 'admin' && pass === 'admin') {
        window.location.href = '/admin-dashboard.html';
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
