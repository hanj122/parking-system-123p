<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Login — ParkWise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            'parkwise-accent': '#34c759',
            'parkwise-accent-dark': '#30d158',
          },
          borderRadius: {
            'apple-sm': '8px',
            'apple-md': '12px',
            'apple-lg': '18px',
            'apple-xl': '22px',
            'apple-2xl': '28px',
          },
        }
      }
    }
  </script>
</head>
<body class="bg-[#1d1d1f] flex items-center justify-center min-h-screen p-4 font-sans antialiased text-white">
  
  <div class="bg-white/5 backdrop-blur-md border border-white/10 p-8 sm:p-10 rounded-apple-2xl shadow-2xl w-full max-w-sm mx-auto flex flex-col items-center">
    <!-- Lock icon -->
    <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-3xl mb-5">
      🔒
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold mb-2 text-center tracking-tight text-white">Operator Login</h1>
    <p class="text-white/50 text-sm mb-6 text-center leading-relaxed">Sign in to manage parking lots and monitor live analytics.</p>

    <form id="login-form" class="w-full flex flex-col gap-3">
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-white/40 mb-1">Username / Email</label>
        <input
          class="w-full px-4 py-3 rounded-apple-md bg-white/10 text-white placeholder-white/40 text-[15px] border border-white/20 outline-none focus:border-parkwise-accent transition-colors"
          id="username"
          type="text"
          placeholder="admin"
          required
        >
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-white/40 mb-1">Password</label>
        <input
          class="w-full px-4 py-3 rounded-apple-md bg-white/10 text-white placeholder-white/40 text-[15px] border border-white/20 outline-none focus:border-parkwise-accent transition-colors"
          id="password"
          type="password"
          placeholder="••••••••"
          required
        >
      </div>
      
      <p id="error-msg" class="text-red-400 text-[13px] hidden mt-1">Invalid credentials. Default: admin / admin.</p>
      
      <button class="w-full mt-3 py-3.5 rounded-full bg-white text-[#1d1d1f] font-semibold text-[15px] hover:bg-gray-200 active:scale-95 transition-all duration-150" type="submit">
        Sign In
      </button>
    </form>

    <div class="mt-8 flex items-center gap-6 text-[13px] text-white/50">
      <a href="demo.html" class="hover:text-white transition-colors flex items-center gap-1">
        <span>←</span> Parking Demo
      </a>
      <span class="text-white/20">·</span>
      <a href="index.html" class="hover:text-white transition-colors flex items-center gap-1">
        Frontpage
      </a>
    </div>
  </div>

  <p class="absolute bottom-6 text-white/15 text-xs select-none text-center w-full">ParkWise Operator Platform · Secure Access</p>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (user === 'admin' && pass === 'admin') {
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
